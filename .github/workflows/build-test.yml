name: Build and Unit Tests (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release with warnings as errors
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Run unit tests with XPlat Code Coverage
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName!~IntegrationTests" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: ./TestResults
